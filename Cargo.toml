[package]
name = "house-predictor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.101"
reqwest = { version = "0.13.2", features = ["blocking"] }
csv = "1.3"
dotenv = "0.15"
env_logger = "0.11"
log = "0.4"
polars = { version = "0.53.0", features = ["lazy", "csv", "ndarray"] }
ndarray = "0.17"
xgboost = "0.1"
axum = "0.8.8"
http = "1.4.0"
serde = { version = "1.0.228", features = ["derive"] }
tokio = "1.49.0"
tracing-subscriber = "0.3.22"
